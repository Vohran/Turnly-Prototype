<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnly Demo</title>
<style>
:root{
 --teal:#028090;--teal2:#016D7B;--tealdk:#08384B;--mint:#02C39A;--mintbg:#DCF7EF;--navy:#0D2137;
 --bg:#F2F7F8;--surface:#FFFFFF;--surface2:#F5F9FA;--soft:#E3F3F5;--ink:#0D2137;--muted:#6A7A88;--line:#E1EBEE;
 --amber:#9A5B00;--amberbg:#FFF1D9;--red:#C2362F;--redbg:#FDE2E2;--blue:#1F4FD1;--bluebg:#E8EEFD;--violet:#6B3FC2;--violetbg:#F0EAFC;--tealink:#027A72;--tealbg:#DCF7EF;
 --shadow:0 2px 6px rgba(13,33,55,.05),0 10px 30px rgba(13,33,55,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081A24;--surface:#10283A;--surface2:#0D2231;--soft:#123848;--ink:#E6F0F2;--muted:#9AB0BC;--line:#1E3B4D;--amberbg:#3A2C10;--amber:#F2B451;--redbg:#3A1715;--red:#FF8A80;--bluebg:#1A2A55;--blue:#8FB0FF;--violetbg:#2C1F4D;--violet:#C3A6FF;--tealbg:#0F3A33;--tealink:#3DDBB3;--mintbg:#0F3A33;--shadow:none}}
:root[data-theme="dark"]{--bg:#081A24;--surface:#10283A;--surface2:#0D2231;--soft:#123848;--ink:#E6F0F2;--muted:#9AB0BC;--line:#1E3B4D;--amberbg:#3A2C10;--amber:#F2B451;--redbg:#3A1715;--red:#FF8A80;--bluebg:#1A2A55;--blue:#8FB0FF;--violetbg:#2C1F4D;--violet:#C3A6FF;--tealbg:#0F3A33;--tealink:#3DDBB3;--mintbg:#0F3A33;--shadow:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.mt{margin-top:16px}.mt8{margin-top:8px}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row .sp,.sp{flex:1}.nowrap{flex-wrap:nowrap;gap:6px}
.grid{display:grid;gap:16px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g2.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
/* brand */
.word{font-weight:800;letter-spacing:-.02em;color:#fff;font-size:22px}.word em{font-style:normal;color:var(--mint)}
.word.xl{font-size:64px;line-height:1}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);flex:none}
.logo svg{width:76%;height:76%}.logo.sm{width:32px;height:32px;border-radius:10px}.logo.big{width:110px;height:110px;border-radius:30px}
.tag{letter-spacing:.32em;font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#08384B,#028090);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 18px}
.top .word{font-size:20px}.demo-tag{font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:999px;text-transform:uppercase}
.clock{font-size:13px;color:rgba(255,255,255,.7)}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}
.tbtn:hover{background:rgba(255,255,255,.2)}
.who{font-size:13px;text-align:right;line-height:1.25;font-weight:700}.who small{display:block;color:rgba(255,255,255,.65);font-weight:500}
.demo-banner{background:var(--mint);color:#0D2137;font-size:12.5px;font-weight:700;text-align:center;padding:5px 16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--teal);color:#fff;font-size:14px}
.btn.mint{background:var(--mint);color:#06302A;box-shadow:0 6px 18px rgba(2,195,154,.25)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:var(--redbg);color:var(--red);border:1px solid #F7B4B4}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}
.btn:disabled,button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-teal{background:var(--tealbg);color:var(--tealink)}.p-amber{background:var(--amberbg);color:var(--amber)}.p-red{background:var(--redbg);color:var(--red)}.p-blue{background:var(--bluebg);color:var(--blue)}.p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.p-violet{background:var(--violetbg);color:var(--violet)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:500;width:100%;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);flex:none}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:1em}
code{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}th{font-size:12px;color:var(--muted);font-weight:800;background:var(--surface2)}.tw{overflow-x:auto}
/* landing */
.landing{min-height:calc(100vh - 80px);background:linear-gradient(160deg,#028090 0%,#016D7B 45%,#08384B 100%);color:#fff;padding:40px 18px 60px}
.land-in{max-width:880px;margin:0 auto}.hero{text-align:center}.hero .logo{margin-bottom:18px}.hero .tag{margin-top:10px}
.hero p{max-width:560px;margin:18px auto 0;color:rgba(255,255,255,.85);font-size:16px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
.role{text-align:left;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:4px}
.role.on{background:rgba(255,255,255,.18);border-color:var(--mint);box-shadow:0 0 0 4px rgba(2,195,154,.25)}
.role .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:22px;margin-bottom:6px}
.role b{font-size:17px}.role .nm{font-weight:700;color:var(--mint);font-size:14px}.role .ds{font-size:13px;color:rgba(255,255,255,.75)}
.lform{margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:18px}
.lform .inp{background:#fff;color:#0D2137;border-color:transparent}.lform .err{color:#FFD1CC}
.walk{margin-top:16px;background:rgba(0,0,0,.15);border-radius:16px;padding:14px 18px}.walk summary{cursor:pointer;font-weight:800}.walk ol{margin:10px 0 0;padding-left:20px;line-height:1.7;font-size:14px;color:rgba(255,255,255,.9)}
.fine{font-size:12px;color:rgba(255,255,255,.6);text-align:center;margin-top:16px}
/* patient phone */
.stage{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:26px 16px 40px}
.phone-frame{width:390px;height:812px;max-height:calc(100vh - 110px);min-height:640px;border-radius:46px;background:var(--bg);border:10px solid #0B1624;box-shadow:0 30px 60px rgba(8,26,36,.35);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{background:var(--teal);color:#fff;display:flex;justify-content:space-between;padding:10px 26px 6px;font-size:13px;font-weight:800;flex:none}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.bnav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 12px}
.bnav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;padding:4px}
.bnav button span{font-size:20px;filter:grayscale(.5);opacity:.75}.bnav button.on{color:var(--teal);font-weight:800}.bnav button.on span{filter:none;opacity:1}
.side-note{max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:14px;box-shadow:var(--shadow);margin-top:60px}
.hdr{background:linear-gradient(160deg,#028090,#016D7B);color:#fff;padding:18px 20px 26px}
.hdr .hi{font-size:14px;color:rgba(255,255,255,.8)}.hdr .nm{font-size:23px;font-weight:800}
.bell{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.15);border:0;cursor:pointer;font-size:19px;position:relative}.bell i{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--mint);border:2px solid #028090}
.brandline{text-align:right;margin-top:10px;font-weight:800;color:rgba(255,255,255,.7)}.brandline em{font-style:normal;color:var(--mint)}.brandline span{font-size:10px;letter-spacing:.3em;font-weight:600;color:rgba(255,255,255,.5)}
.search{background:#fff;color:#9AAAB5;border-radius:14px;padding:12px 14px;margin-top:8px;font-size:14px}
.pad{padding:16px 16px 22px}
.appbar{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.back{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface2);cursor:pointer;font-size:18px}
.tcard{background:linear-gradient(135deg,#028090,#016D7B);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(2,128,144,.25)}
.tcard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.tcard.warn{background:linear-gradient(135deg,#B9462A,#D9622B)}
.tpill{display:inline-block;background:var(--mint);color:#06302A;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.tcard.warn .tpill{background:#fff;color:#B9462A}
.tcard h3{font-size:20px;margin-top:10px;color:#fff}.tcard .sub{color:rgba(255,255,255,.85);font-size:14px;margin-top:2px}.tcard .meta{font-size:13px;margin-top:10px;color:#fff}
.wbtn{margin-top:14px;border:0;background:#fff;color:#016D7B;font-weight:800;border-radius:12px;padding:10px 14px;cursor:pointer;position:relative;z-index:1}.wbtn.ghost{background:rgba(255,255,255,.18);color:#fff}
.ocard{background:linear-gradient(135deg,#C2410C,#E0601F);color:#fff;border-radius:22px;padding:16px;box-shadow:0 10px 24px rgba(194,65,12,.25)}
.ocard .live{font-size:11px;font-weight:800;letter-spacing:.06em}.ocard .now{margin-top:8px;background:rgba(255,255,255,.18);border-radius:14px;padding:6px 12px;font-size:30px;font-weight:900;display:inline-block}.ocard .now small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em}
.ocard-r{font-size:13px;flex:1;min-width:120px}.obtn{margin-top:12px;width:100%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:9px;font-weight:800;cursor:pointer}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile.wide{flex-direction:row;align-items:center;gap:12px;width:100%}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:8px}.tile.wide .ti{margin:0}
.tile b{font-size:15px}.tile small{color:var(--muted);font-size:12.5px}
.sec{margin:20px 2px 10px}.wcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.wcard.left{text-align:left}
.res{background:var(--surface2);border-radius:14px;padding:12px;margin-top:12px;font-size:14px}.res p{margin:6px 0 0}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:18px 2px 10px;display:flex;justify-content:space-between;gap:8px}.lbl:first-child{margin-top:4px}.hintx{letter-spacing:0;font-weight:700;color:var(--teal);text-transform:none}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px}.doc.on{border-color:var(--teal);background:var(--soft)}
.av{width:48px;height:48px;border-radius:14px;background:#FFF2DE;display:grid;place-items:center;font-size:24px;flex:none}.av.sm{width:34px;height:34px;font-size:17px;border-radius:10px}
.doc small{display:block;color:var(--muted);font-size:12.5px}.doc small.g{color:var(--tealink);font-weight:700}
.selp{margin-left:auto;background:var(--teal);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:5px 10px}
.why-box{background:var(--surface);border:1px dashed var(--teal);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px}
.dates{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.date{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800}
.date small{font-size:11px;color:var(--muted);font-weight:700}.date b{font-size:20px}.date i{font-style:normal;font-size:10px;color:var(--teal)}
.date.on{background:var(--teal);border-color:var(--teal);color:#fff}.date.on small,.date.on i{color:rgba(255,255,255,.85)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:700;font-size:13.5px}.time.wide{grid-column:1/-1;background:var(--mintbg);border-color:var(--mint);color:var(--tealink)}
.time.on{background:var(--teal);border-color:var(--teal);color:#fff}
.reason{border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:14px;background:var(--surface)}
.cbtn{width:100%;margin-top:18px;border:0;background:var(--teal);color:#fff;font-weight:800;font-size:16px;border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 8px 20px rgba(2,128,144,.25)}.cbtn.sm{width:auto;margin-top:0;font-size:13px;padding:8px 12px;border-radius:10px}
.party{font-size:54px;margin-top:6px}.ttl{font-size:24px;margin-top:6px}
.ticket{background:var(--surface);border-radius:22px;padding:20px;margin-top:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tk-h{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted)}.tk-n{font-size:66px;font-weight:900;color:var(--teal);line-height:1.1}
.ticket .chip{margin-top:6px}.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:8px;text-align:left;margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;font-size:14px}.ticket dt{color:var(--muted)}.ticket dd{margin:0;text-align:right;font-weight:800}.ticket dd.g{color:var(--tealink)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--violetbg);color:var(--violet);border-radius:999px;font-size:12px;font-weight:800;padding:4px 10px}
.rl{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.7}
.nowcard{background:linear-gradient(135deg,#028090,#016D7B);color:#fff;border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 24px rgba(2,128,144,.25)}
.nowcard small{letter-spacing:.24em;font-weight:800;color:rgba(255,255,255,.7);font-size:12px}.nowcard .nn{font-size:76px;font-weight:900;color:var(--mint);line-height:1.05}.nowcard span{font-size:14px;color:rgba(255,255,255,.9)}
.alert-p,.alert-g,.turn{display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px;margin:12px 0;font-size:20px}
.alert-p{background:var(--redbg);border:1.5px solid #F7B4B4}.alert-g{background:var(--mintbg);border:1.5px solid #9DE8D5}
.alert-p b,.alert-g b{display:block;font-size:14.5px}.alert-p small,.alert-g small{display:block;font-size:12.5px;color:var(--muted)}
.turn{background:linear-gradient(135deg,#15803D,#16A34A);color:#fff;font-size:28px}.turn b{display:block;font-size:19px}.turn small{font-size:13px;opacity:.9}
.prog{height:10px;background:var(--surface2);border-radius:5px;margin:12px 0 14px;overflow:hidden}.prog span{display:block;height:100%;background:linear-gradient(90deg,#028090,#02C39A);border-radius:5px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.trio b{font-size:26px;display:block;font-weight:900}.trio b.t{color:var(--teal)}.trio small{color:var(--muted);font-weight:700}
.wcard.ai{border:1.5px solid #9DE8D5;background:linear-gradient(180deg,var(--mintbg),var(--surface) 70%)}
.ail{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--tealink)}.aiv{font-size:30px;font-weight:900}
.ai details{margin-top:8px}.ai summary{cursor:pointer;font-weight:800;color:var(--teal);font-size:14px}.ai ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}.ai li{margin:4px 0}
.pos{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding:4px}
.pc{flex:none;min-width:46px;height:52px;border-radius:14px;background:var(--surface2);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;padding:0 6px}
.pc.done{background:var(--mintbg);color:var(--tealink)}.pc.srv{background:#BDEFE2;color:#06302A}.pc.me{background:var(--teal);color:#fff;box-shadow:0 0 0 4px #B9DDE2}.pc small{font-size:9px;font-weight:800}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.ab{border:1.5px solid var(--teal);background:var(--surface);color:var(--teal);font-weight:800;border-radius:14px;padding:12px 4px;cursor:pointer;font-size:13.5px}.ab.red{border-color:#F7B4B4;background:var(--redbg);color:var(--red)}.ab.sm{padding:7px 12px;font-size:13px}
.map{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.mapline{height:92px;background:linear-gradient(120deg,#DFF3EC,#D6EEF3 60%,#CFE6F2);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:relative}
.mapline::before{content:"";position:absolute;left:44px;right:48px;top:50%;height:4px;background:#fff;border-radius:2px}
.mapline i{position:relative;width:22px;height:22px;border-radius:50%;background:var(--teal);border:5px solid #B9DDE2}.mapline i.b{width:34px;height:34px;background:#fff;border:2px solid #E25555;display:grid;place-items:center;font-style:normal;font-size:16px}
.mapline span{position:relative;background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:#0D2137}
.mapft{display:flex;align-items:center;gap:6px;padding:10px 14px;font-size:14px}.lnk{color:var(--teal);font-weight:800}
.demo-btn{margin-top:14px;width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;cursor:pointer;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-bottom:1px solid var(--line)}.seg button{border:0;background:none;padding:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}.seg button.on{color:var(--teal);border-color:var(--teal)}
.meta2{font-size:13px;color:var(--muted);margin-top:8px}
.steps{display:flex;margin:4px 0}.st{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted);font-weight:700}
.st::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}.st:first-child::before{display:none}

// ===================== helpers =====================
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dayName(off=S.day){const d=new Date(2026,10,18+off);return `${DAYS[d.getDay()]} ${d.getDate()} Nov`}
function hm(m){m=Math.round(m);let h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`}

// ===================== triage (sample rules) =====================
function triage(test,v,preg){
 if(test==='Blood pressure'){const s=+v.sys,d=+v.dia;if(!s||!d)return null;const val=`${s}/${d} mmHg`;
  if(preg&&(s>=160||d>=110))return{val,flag:'Very high for pregnancy',window:'Same day',service:'Antenatal',why:'Blood pressure of 160/110 or more in pregnancy needs to be seen the same day.'};

  if(s>=180||d>=120)return{val,flag:'Very high',window:'Same day',service:'Hypertension',why:'Blood pressure of 180/120 or more needs to be seen the same day.'};
  if(s>=140||d>=90)return{val,flag:'High',window:'Within 7 days',service:'Hypertension',why:'Blood pressure of 140/90 or more needs a follow-up within 7 days.'};
  return{val,flag:'Normal',window:null,why:'Below 140/90. No referral needed; recheck at the next camp.'}}
 if(test==='Blood sugar (random)'){const g=+v.val;if(!g)return null;const val=`${g} mg/dL`;
  if(g>=300)return{val,flag:'Very high',window:'Within 48 hours',service:preg?'Antenatal':'Diabetes',why:'A random blood sugar of 300 mg/dL or more needs a check within 48 hours.'};
  if(g>=200)return{val,flag:'High',window:'Within 7 days',service:preg?'Antenatal':'Diabetes',why:'A random blood sugar of 200 mg/dL or more suggests diabetes and needs a follow-up within 7 days.'};
  if(preg&&g>=140)return{val,flag:'Raised for pregnancy',window:'Within 7 days',service:'Antenatal',why:'In pregnancy, 140 mg/dL or more needs a test for gestational diabetes.'};
  return{val,flag:'Normal',window:null,why:'In the normal range. No referral needed.'}}
 if(test==='Haemoglobin'){const h=+v.val;if(!h)return null;const val=`${h} g/dL`,cut=preg?11:12;
  if(h<7)return{val,flag:'Severe anaemia',window:'Within 48 hours',service:preg?'Antenatal':'General OPD',why:'Haemoglobin below 7 g/dL is severe anaemia and needs a check within 48 hours.'};
  if(h<cut)return{val,flag:'Low (anaemia)',window:'Within 14 days',service:preg?'Antenatal':'General OPD',why:`Haemoglobin below ${cut} g/dL is anaemia and needs a follow-up within 14 days.`};
  return{val,flag:'Normal',window:null,why:'In the normal range. No referral needed.'}}
 if(test==='Antenatal check'){const w=+v.val;if(!w)return null;return{val:`${w} weeks`,flag:'Routine visit due',window:'Within 14 days',service:'Antenatal',why:'Antenatal visit is due for this stage of pregnancy.'}}

function boost(q){if(q.call)return 100;const p=P(q.pid),t=tagsFor(p);let b=0;if(t.includes('Expecting mother'))b+=2;if(t.includes('Chronic care'))b+=1;if(t.includes('Elderly'))b+=1;return Math.min(b,2)}

const r5=x=>Math.max(0,Math.round(x/5)*5);
function estimate(token){const o=ordered(),k=o.findIndex(q=>q.token===token);if(k<0)return null;const{a,sd,n}=stats();const busy=S.queue.some(q=>q.status==='With doctor');
 const mid=(k+(busy?.5:0))*a;const spread=1.3*sd*Math.sqrt(k+1)+2;const me=o[k];const myB=boost(me);
 const laterPri=o.slice(k+1).filter(q=>boost(q)>0).length;const extra=myB?0:4;
 let lo=r5(mid-spread),hi=r5(mid+spread+extra);if(hi<=lo)hi=lo+5;

 const why=[`${k===0?'No one is':k===1?'1 patient is':k+' patients are'} ahead of you${busy?', and 1 patient is with the doctor now':''}.`,
  `Dr Farah is taking about ${a.toFixed(0)} minutes per patient today (her last ${n} visits).`,

  `The range is ±${Math.round(spread)} minutes because visit times vary${k>2?' and you are further back in the line':''}.`].filter(Boolean);
 return{k,lo,hi,mid:r5(mid),why,a,moved}}

 ${l.length?l.map(r=>{const p=P(r.pid);return `<div class="pcard"><div class="row"><span class="av">${p.preg?'🤰':'🧑'}</span><div><h3>${esc(p.name)}</h3><div class="small muted">${p.age} yrs${p.preg?` · ${p.preg} weeks pregnant`:''}${p.chronic.length?' · '+p.chronic.join(', '):''} · ${esc(p.phone||'')}</div></div><span class="sp"></span>${pill('Awaiting review')}</div>
 <div class="g2 mt"><div><div class="small muted">${esc(r.source)} · by ${esc(r.by)}</div><div class="bigres">${esc(r.test)}: ${esc(r.value)}</div><div class="row mt8">${pill(r.flag,'p-amber')} ${r.tags.map(tagPill).join(' ')}</div><div class="small muted mt8">🔒 Consent to share recorded ${esc(r.consent)}</div></div>
 <div class="sugg"><div class="small muted">✨ Turnly suggests</div><b>${esc(r.service)} · ${esc(r.window)}</b><div class="small mt8">${esc(r.why||triageWhy(r))}</div></div></div>
 <div class="row mt"><button class="btn mint" data-review="${r.id}">Review and decide</button></div></div>`}).join(''):`<div class="pcard muted">No referrals waiting. New ones from health workers appear here.</div>`}`}
function triageWhy(r){return r.value==='262 mg/dL'?'A random blood sugar of 200 mg/dL or more suggests diabetes and needs a follow-up within 7 days.':''}
function dQueue(){const o=ordered();const cur=S.queue.find(q=>q.status==='With doctor');const seen=S.queue.filter(q=>q.status==='Seen').length;const{a}=stats();
 const all=S.queue.slice();
 return `<div class="calling"><div class="cl">CURRENTLY CALLING</div>${cur?`<div class="cn">${cur.token}</div><div class="cnm">${esc(P(cur.pid).name)}</div><div class="row center-row">${tagsFor(P(cur.pid)).map(tagPill).join(' ')}<span class="dchip">🩺 Dr Farah Siddiqui · OPD</span></div>${cur.ref?`<div class="small muted mt8">Referral ${cur.ref}: ${esc(R(cur.ref).test)} ${esc(R(cur.ref).value)} · ${esc(R(cur.ref).reviewNote||'')}</div>`:''}`:`<div class="cn" style="color:var(--line)">—</div><div class="cnm muted">No one with you</div>`}
 <div class="cacts">${cur?`<button class="pv" data-finish="${cur.token}">✓ Finish visit</button>`:''}<button class="callnext" data-a="callNext" ${cur||!o.length?'disabled':''}>📢 Call Next Patient${o.length&&!cur?` (${o[0].token})`:''}</button></div>${cur?'<div class="tiny muted mt8">Finish the current visit to call the next patient.</div>':''}</div>
 <div class="stats3"><div class="s on"><b>${cur?cur.token:'—'}</b><small>Current #</small></div><div class="s"><b>${o.length}</b><small>Remaining</small></div><div class="s"><b>${seen}</b><small>Seen Today</small></div><div class="s"><b>${a.toFixed(1)}</b><small>Avg min / patient</small></div></div>
 <div class="pcard"><div class="row"><h3>Up next · Turnly’s suggested order</h3><span class="sp"></span><span class="tiny muted">Priority patients move up at most 2 places</span></div><div class="tw mt8"><table><thead><tr><th>#</th><th>Token</th><th>Patient</th><th>Priority</th><th>Arrived</th><th>AI wait</th><th></th></tr></thead><tbody>${o.length?o.map((q,i)=>{const p=P(q.pid),e=estimate(q.token);return `<tr><td>${i+1}</td><td><b class="tok">${q.token}</b></td><td>${esc(p.name)}<div class="tiny muted">${q.here?'Checked in':'On the way'}${q.ref?' · referral '+q.ref:''}</div></td><td>${tagsFor(p).map(tagPill).join(' ')||'<span class="muted small">—</span>'}${q.call?' <span class="pill p-amber">Your choice</span>':''}</td><td class="small">${q.arr}</td><td class="small">${e.lo}–${e.hi} min</td><td><div class="row nowrap">${i>0?`<button class="btn alt sm" data-callfirst="${q.token}">Call first</button>`:''}<button class="btn warn sm" data-noshow="${q.token}">No-show</button></div></td></tr>`}).join(''):'<tr><td colspan="7" class="muted">No one waiting.</td></tr>'}</tbody></table></div></div>
 <div class="pcard"><div class="row"><h3>Today’s Patients — ${all.length} Total</h3><span class="sp"></span><span class="muted small">${seen} / ${all.length} seen</span></div><div class="pgrid">${all.map(q=>{const p=P(q.pid),t=tagsFor(p);return `<div class="pg ${q.status==='Seen'?'seen':q.status==='With doctor'?'cur':q.status==='No-show'?'ns':''}"><b>${q.token}</b><small>${esc(p.name.split(' ')[0])}</small>${t.includes('Expecting mother')?'<i title="Expecting mother">🤰</i>':t.includes('Chronic care')?'<i title="Chronic care">♥</i>':''}</div>`}).join('')}</div><div class="legend tiny muted mt8"><span class="lg seen"></span>Seen <span class="lg cur"></span>With doctor <span class="lg"></span>Waiting <span class="lg ns"></span>No-show</div></div>`}
function vWorker(){const tab=U.tab||'screen';const al=S.alerts.filter(a=>!a.done).length;const tabs=[['screen','📝 New Screening',null],['tracker','📋 Follow-up Tracker',S.refs.length],['alerts','🔔 Alerts',al]];
 return `<div class="panel">${panelHead('Community Health Panel · Gulshan Block 6 · Nasreen Akhtar',null)}<div class="pbody">${funnel()}<div class="ptabs mt">${tabs.map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}${n!=null?` <b>${n}</b>`:''}</button>`).join('')}</div>${tab==='screen'?wScreen():tab==='tracker'?trackerTable(S.refs,'worker'):wAlerts()}</div><div class="pfoot">Turnly · Gulshan Block 6 · ${esc(nowStr())}</div></div>`}
function funnel(){const refs=S.refs;const scr=refs.length+S.screenedNormal;const ref=refs.length;const bk=refs.filter(r=>r.slot).length;const att=refs.filter(r=>['With doctor','Completed'].includes(r.status)).length;const closed=refs.filter(r=>r.status==='Completed').length;
 return `<div class="funnel">${[['Screened',scr],['Referred',ref],['Booked',bk],['Attended',att],['Follow-up complete',closed]].map(([l,v],i)=>`<div class="s ${i===4?'on':''}"><b>${v}</b><small>${l}</small><div class="bar"><span style="width:${Math.round(v/scr*100)}%"></span></div></div>`).join('')}</div>`}
function wScreen(){const f=U.sel.form||(U.sel.form={name:'',phone:'',age:'',preg:'',chronic:[],test:'Blood pressure',v:{},consent:false});const p=+f.preg||0;const t=triage(f.test,f.v,p);
 if(U.sel.step===2&&t&&t.window)return wClinics(f,t);
 const fields=f.test==='Blood pressure'?`<label class="f">Systolic (top)<input class="inp" data-v="sys" inputmode="numeric" value="${esc(f.v.sys||'')}" placeholder="e.g. 150"></label><label class="f">Diastolic (bottom)<input class="inp" data-v="dia" inputmode="numeric" value="${esc(f.v.dia||'')}" placeholder="e.g. 98"></label>`:`<label class="f">${f.test==='Blood sugar (random)'?'Result (mg/dL)':f.test==='Haemoglobin'?'Result (g/dL)':'Weeks of pregnancy'}<input class="inp" data-v="val" inputmode="decimal" value="${esc(f.v.val||'')}"></label>`;
 return `<div class="g2 wide"><div class="pcard"><div class="row"><h3>Record a screening result</h3><span class="sp"></span><button class="btn alt sm" data-a="sample">Fill sample</button></div><div class="grid mt" style="gap:12px">
 <div class="g2"><label class="f">Patient name<input class="inp" data-f="name" value="${esc(f.name)}"></label><label class="f">Mobile<input class="inp" data-f="phone" inputmode="tel" value="${esc(f.phone)}" placeholder="03XX-XXXXXXX"></label></div>
 <div class="g2"><label class="f">Age<input class="inp" data-f="age" inputmode="numeric" value="${esc(f.age)}"></label><label class="f">Weeks pregnant (if pregnant)<input class="inp" data-f="preg" inputmode="numeric" value="${esc(f.preg)}" placeholder="Leave empty if not"></label></div>
 <div class="f">Long-term conditions<div class="row">${['Diabetes','Hypertension','Heart disease','TB'].map(c=>`<label class="chk small"><input type="checkbox" data-chronic="${c}" ${f.chronic.includes(c)?'checked':''}>${c}</label>`).join('')}</div></div>
 <label class="f">Screening test<select class="inp" data-f="test">${['Blood pressure','Blood sugar (random)','Haemoglobin','Antenatal check'].map(x=>`<option ${x===f.test?'selected':''}>${x}</option>`).join('')}</select></label>
 <div class="g2">${fields}</div>
 <label class="chk"><input type="checkbox" data-f="consent" ${f.consent?'checked':''}><span>🔒 The patient agrees to share this result with the clinic Turnly suggests, and to get SMS or WhatsApp reminders.</span></label><div class="err" id="serr"></div></div></div>
 <div class="pcard"><h3>Result</h3><div id="tri" class="mt8">${triBox(t)}</div></div></div>`}
function triBox(t){if(!t)return'<p class="muted" style="margin:0">Enter the result to see what it means.</p>';
 return `<div class="bigres">${esc(t.val)}</div><div class="mt8">${pill(t.flag,t.window?(t.window==='Same day'?'p-red':'p-amber'):'p-teal')}</div>
 <div class="sugg mt">${t.window?`<div class="small muted">✨ Suggested follow-up</div><b>${t.service} · ${t.window}</b>`:'<b>No referral needed</b>'}<div class="small mt8"><b>Why:</b> ${esc(t.why)}</div></div>
 <div class="tiny muted mt8">Sample rules set by the clinic. A doctor reviews every referral.</div>
 ${t.window?`<button class="btn mint block mt" data-a="toClinics">Find the right clinic →</button>`:`<button class="btn alt block mt" data-a="saveNormal">Save result</button>`}`}
function rankClinics(t){const need=WINDOW_DAYS[t.window];return Object.entries(CLINICS).map(([id,c])=>{const has=c.services.includes(t.service);const slotDays=c.next==='Today'?0:1;const fits=slotDays<=need;const wait=id==='C1'?Math.round((ordered().length+1)*stats().a):c.wait;
 const score=(has?0:100)+(fits?0:50)+c.km*2+wait/10;const why=[has?`Offers ${t.service.toLowerCase()} care`:`Does not offer ${t.service.toLowerCase()} care`,`${c.km} km from the patient`,`Next slot ${c.next.toLowerCase()}${fits?'':` (too late for “${t.window.toLowerCase()}”)`}`,`Current wait about ${wait} min`];return{id,c,has,fits,score,why}}).sort((a,b)=>a.score-b.score)}
function wClinics(f,t){const rk=rankClinics(t);const sel=U.sel.clinic||rk.find(x=>x.has&&x.fits)?.id;U.sel.clinic=sel;
 return `<div class="pcard"><div class="row"><h3>Choose the clinic for ${esc(f.name)}</h3><span class="sp"></span>${pill(t.service+' · '+t.window,'p-amber')}</div><div class="grid mt" style="gap:10px">
 ${rk.map((x,i)=>`<button class="clinic ${x.id===sel?'on':''} ${x.has&&x.fits?'':'na'}" ${x.has&&x.fits?`data-clinic="${x.id}"`:'disabled'}><div class="row"><span class="rank">${i+1}</span><span class="av sm">🏥</span><div><b>${x.c.name}</b> <span class="small muted">${x.c.area}</span>${i===0?' <span class="pill p-teal">Best match</span>':''}</div></div><div class="small muted mt8">${x.why.join(' · ')}</div></button>`).join('')}
 <div class="tiny muted">✨ Ranked by: offers the right service, can see the patient in time, distance, then current wait. The demo doctor login is at Gulshan Family Clinic.</div>
 <div class="row"><button class="btn alt" data-a="backScreen">← Back</button><span class="sp"></span><button class="btn mint" data-a="sendRef">Send referral for doctor review →</button></div></div></div>`}
const ORD={'Missed':0,'Awaiting review':1,'Accepted':2,'Booked':3,'In queue':4,'With doctor':5,'Completed':6};
function trackerTable(l,who){const rows=l.slice().sort((a,b)=>(ORD[a.status]??9)-(ORD[b.status]??9));
 return `<div class="pcard"><div class="row"><h3>${who==='doctor'?'Referred patients':'Follow-up tracker'}</h3><span class="sp"></span><span class="tiny muted">Every referral is tracked until the visit is confirmed</span></div><div class="tw mt8"><table><thead><tr><th>Patient</th><th>Result</th><th>Follow-up</th><th>Status</th><th>Visit check</th><th></th></tr></thead><tbody>${rows.map(r=>{const p=P(r.pid);const vc=r.visit?`${r.visit.clinic?'✅':'⬜'} Clinic<br>${r.visit.patient?'✅':'⬜'} Patient`:'—';
 return `<tr><td><b>${esc(p.name)}</b><div class="tiny muted">${r.id}${r.tags.length?' · '+r.tags.join(', '):''}</div></td><td class="small">${esc(r.test)}<br><b>${esc(r.value)}</b></td><td class="small">${esc(r.service)}<br>${esc(r.slot||r.window)}</td><td>${pill(r.status)}</td><td class="small">${vc}</td><td><div class="row nowrap"><button class="btn alt sm" data-hist="${r.id}">History</button>${who==='worker'&&['Missed','Accepted'].includes(r.status)&&r.pid!=='P1'?`<button class="btn mint sm" data-bookfor="${r.id}">Book for patient</button>`:''}${who==='worker'&&r.status==='Missed'?`<button class="btn alt sm" data-call="${r.id}">Log call</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div></div>`}
function wAlerts(){const l=S.alerts.slice().reverse();return `<div class="pcard"><h3>Alerts</h3><div class="mt8">${l.length?l.map(a=>`<div class="msg"><span class="ch sms">!</span><div style="flex:1"><div>${esc(a.text)}</div><time>${esc(a.at)}</time>${a.done?' <span class="pill p-teal">Done</span>':''}</div>${a.ref&&!a.done?`<button class="btn alt sm" data-hist="${a.ref}">Open</button>`:''}</div>`).join(''):'<p class="muted">No alerts.</p>'}</div></div>`}

 <label class="f" id="dvSvc" style="display:none">Service<select class="inp" id="ds">${CLINICS.C1.services.map(s=>`<option ${s===r.service?'selected':''}>${s}</option>`).join('')}</select></label>

function histModal(id){const r=R(id),p=P(r.pid);modal(`<div class="hd"><h2>${esc(p.name)} · ${r.id}</h2><button class="btn alt sm x" data-a="close" aria-label="Close">✕</button></div><div class="bd">${journey(r)}<div class="small"><b>${esc(r.test)}: ${esc(r.value)}</b> · ${esc(r.service)} · ${esc(r.window)}${r.reviewNote?`<br>Doctor’s note: ${esc(r.reviewNote)}`:''}${r.outcome?`<br>Outcome: ${esc(r.outcome)}`:''}</div><div>${r.log.slice().reverse().map(l=>`<div class="msg"><div><div class="small">${esc(l[1])}</div><time>${esc(l[0])}</time></div></div>`).join('')}</div></div>`)}
function slotModal(id){const r=R(id);modal(`<div class="hd"><h2>Book for ${esc(P(r.pid).name)}</h2><button class="btn alt sm x" data-a="close" aria-label="Close">✕</button></div><div class="bd"><label class="f">Time<select class="inp" id="bs"><option value="today">Today (join the live queue)</option><option value="tom">Tomorrow, 10:00 am</option></select></label><div class="tiny muted">The patient gets an SMS with the token and reminders.</div></div><div class="ft"><button class="btn alt" data-a="close">Cancel</button><button class="btn mint" data-dobook="${id}">Book</button></div>`)}

function joinQueue(r,here){const t='#'+S.nextToken++;r.token=t;S.queue.push({token:t,pid:r.pid,status:'Waiting',arr:hm(S.min).replace(/ (am|pm)/,''),here:!!here,ref:r.id});r.status='In queue';return t}
function book(r,off,time){if(off===0&&time==='live'){r.slot='Today';const t=joinQueue(r,false);log(r,`Booked for today, token ${t}. Joined the live queue.`);const e=estimate(t);msg(r.pid,'wa',`Turnly: You’re in today’s queue at ${CLINICS[r.clinic].name}. Token ${t}. Estimated wait ${e.lo}–${e.hi} min. We’ll tell you when to leave home.`);return}
 const [hh,mm]=time.split(':').map(Number);r.slot=`${off===0?'Today':dayName(S.day+off)}, ${hm(hh*60+mm)}`;r.slotDay=S.day+off;r.slotMin=hh*60+mm;r.token='#'+S.nextToken++;r.status='Booked';r.rem=[off>0?`${dayName(S.day+off-1)}, 6:00 pm: reminder with your token`:'Today: reminder 2 hours before',`${off===0?'Today':dayName(S.day+off)}, 2 hours before: time to get ready`,'When 2 patients are ahead of you: time to come in','If you miss it: a message the next morning to rebook'];log(r,`Booked for ${r.slot}, token ${r.token}`);msg(r.pid,'wa',`Turnly: Booked for ${r.slot} at ${CLINICS[r.clinic].name} with Dr Farah Siddiqui. Your token is ${r.token}. We’ll remind you before your visit.`)}
function finishCurrentIfNone(){}

  else{const w=$('#dw').value,tags=[...document.querySelectorAll('.dt:checked')].map(x=>x.value);const changed=w!==r.window;if(v==='redirect'){r.service=$('#ds').value}r.window=w;r.tags=tags;r.reviewNote=note||r.reviewNote;r.status='Accepted';
   log(r,`Accepted by Dr Farah Siddiqui: ${w.toLowerCase()}, ${r.service}${tags.length?', priority: '+tags.join(', ').toLowerCase():''}${changed?' (changed from Turnly’s suggestion)':''}`);msg(r.pid,'wa',`Turnly: Dr Farah Siddiqui has asked to see you ${w.toLowerCase()}. Tap to choose a time and get your token.`);log(r,'Booking link sent to patient by WhatsApp')}
  tick(3);close();toast(v==='decline'?'Referral declined':'Accepted. The patient got a booking link.');render();return}

 if(d.done){const q=S.queue.find(x=>x.token===d.done);q.status='Seen';const dur=6+Math.round(Math.random()*3);S.durs.push(dur);tick(dur);const nx=+$('#fn').value,out=$('#fo').value.trim();
  if(q.ref){const r=R(q.ref);r.status='Completed';r.visit={clinic:true,patient:false};r.outcome=out;log(r,'Seen by Dr Farah Siddiqui. Clinic confirmed the visit.');msg(r.pid,'app','Turnly: Did you see Dr Farah today? Tap Yes to confirm your visit.');
   if(nx){const d2=Math.round(nx/7);const n={id:'R-'+S.ids++,pid:r.pid,parent:r.id,source:'Follow-up from visit '+r.id,by:'Dr Farah Siddiqui',test:r.test,value:r.value,flag:'Follow-up',window:'Within 14 days',service:r.service,clinic:'C1',status:'Booked',created:dayName(),consent:r.consent,tags:r.tags.slice(),slot:'',token:'#'+S.nextToken++,rem:['Day before: reminder with your token','2 hours before: time to get ready'],log:[[nowStr(),`Next follow-up booked by Dr Farah Siddiqui in ${d2} weeks`]]};n.slot=`In ${d2} weeks (${new Date(2026,10,18+S.day+nx).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}), 10:00 am`;S.refs.push(n);log(r,`Next follow-up booked: ${n.slot}`)}}
  close();toast('Visit saved.');render();return}
 if(d.noshow){const q=S.queue.find(x=>x.token===d.noshow);q.status='No-show';if(q.ref){const r=R(q.ref);r.status='Missed';log(r,'Marked no-show by the clinic');tick(1);msg(r.pid,'wa',`Turnly: We missed you at ${CLINICS[r.clinic].name} today. Your follow-up is important. Tap to choose a new time.`);log(r,'Reminder sent: rebook your visit');S.alerts.push({at:nowStr(),text:`${P(r.pid).name} missed a follow-up visit today (${r.test} ${r.value}). Reminder sent; if not rebooked in 2 days, please call.`,ref:r.id})}
  toast('Marked no-show. Patient reminded; health worker alerted.');render();return}
 if(d.callfirst){S.queue.forEach(x=>delete x.call);S.queue.find(x=>x.token===d.callfirst).call=true;toast('Moved to the front. Your choice overrides Turnly’s order.');render();return}
 const a=d.a;if(!a)return;
 if(a==='close')close();
 if(a==='reset'){S=seed();U={role:U.role,tab:null,sel:{}};close();toast('Demo reset');render()}
 if(a==='logout'){U={role:null,tab:null,sel:{login:U.role}};render()}
 if(a==='book'){const r=mainRef();book(r,U.sel.date,U.sel.time);U.sel.date=null;U.sel.time=null;U.tab='confirmed';U.keepScroll=false;toast(`Booked. Your token is ${r.token}.`);render()}
 if(a==='rebookMe'){const r=mainRef();r.status='Accepted';log(r,'Patient chose to rebook');U.tab='book';U.sel.date=null;U.sel.time=null;S.alerts.forEach(x=>{if(x.ref===r.id)x.done=true});render()}
 if(a==='skipday'){const r=mainRef();S.day=r.slotDay;S.min=Math.max(9*60,(r.slotMin||600)-40);S.queue=S.queue.filter(q=>q.status==='Waiting'||q.status==='With doctor');const t=r.token;S.queue.push({token:t,pid:'P1',status:'Waiting',arr:'09:10',here:false,ref:r.id});r.status='In queue';log(r,'Appointment day. Joined the live queue.');msg('P1','wa',`Turnly: Today is your visit. Token ${t}. We’ll tell you when to leave home.`);U.tab='queue';render()}
 if(a==='checkin'){const q=S.queue.find(x=>x.ref===mainRef().id&&x.status==='Waiting');q.here=true;log(R(q.ref),'Checked in at the clinic');toast('Checked in');render()}
 if(a==='wait10'){const cur0=S.queue.find(q=>q.status==='With doctor');if(cur0&&cur0.pid==='P1'){toast('You are with the doctor. Switch to the doctor login to finish the visit.');return}tick(10);const cur=S.queue.find(q=>q.status==='With doctor');if(cur){cur.status='Seen';S.durs.push(8);if(cur.ref){const r=R(cur.ref);if(r.pid!=='P1'){r.status='Completed';r.visit={clinic:true,patient:true};log(r,'Seen')}}}const o=ordered();if(o[0]){const q=S.queue.find(x=>x.token===o[0].token);q.status='With doctor';delete q.call;if(q.ref&&R(q.ref).pid==='P1')msg('P1','app',`Turnly: It’s your turn. Please go to Room 3.`);else{const me=S.queue.find(x=>x.pid==='P1'&&x.status==='Waiting');if(me){const e=estimate(me.token);if(e&&e.k<=2)msg('P1','wa',`Turnly: ${e.k===0?'You are next':e.k===1?'1 patient is ahead of you':e.k+' patients are ahead of you'}. Please be at the clinic.`)}}if(q.ref)R(q.ref).status=R(q.ref).status==='In queue'?'With doctor':R(q.ref).status}render()}
 if(a==='callNext'){const o=ordered();const q=S.queue.find(x=>x.token===o[0].token);q.status='With doctor';delete q.call;tick(1);if(q.ref){const r=R(q.ref);r.status='With doctor';log(r,'Called in by Dr Farah Siddiqui');msg(r.pid,'app','Turnly: It’s your turn. Please go to Room 3.')}const me=ordered()[0];if(me&&me.ref)msg(R(me.ref).pid,'wa','Turnly: You are next. Please be at the clinic.');render()}
 if(a==='confirmVisit'){const r=myRefs().filter(x=>x.status==='Completed'&&x.visit&&!x.visit.patient).slice(-1)[0];r.visit.patient=true;log(r,'Patient confirmed the visit. Follow-up complete.');toast('Thank you. Your visit is confirmed.');render()}
 if(a==='denyVisit'){const r=myRefs().filter(x=>x.status==='Completed').slice(-1)[0];log(r,'Patient says the visit did not happen: clinic asked to check');S.alerts.push({at:nowStr(),text:`${P(r.pid).name} says the visit did not happen, but the clinic marked it as seen. Please check.`,ref:r.id});toast('Thanks. We’ll check with the clinic.');render()}
 if(a==='sample'){U.sel.form={name:'Sana Javed',phone:'0312-5550198',age:'29',preg:'31',chronic:[],test:'Blood pressure',v:{sys:'152',dia:'99'},consent:true};render()}
 if(a==='toClinics'){const f=U.sel.form;const er=!f.name?'Add the patient’s name.':!/^03\d{2}-?\d{7}$/.test(f.phone)?'Add a valid mobile number (03XX-XXXXXXX).':!f.age?'Add the patient’s age.':!f.consent?'The patient must agree to share the result before you refer.':'';if(er){$('#serr').textContent=er;return}U.sel.step=2;U.sel.clinic=null;render()}
 if(a==='backScreen'){U.sel.step=1;render()}
 if(a==='saveNormal'){S.screenedNormal++;U.sel.form=null;toast('Result saved. No referral needed.');render()}
 if(a==='sendRef'){const f=U.sel.form,p=+f.preg||0,t=triage(f.test,f.v,p);const pid='N'+S.ids;S.patients[pid]={name:f.name,age:+f.age,preg:p,chronic:f.chronic.slice(),phone:f.phone.slice(0,4)+'-•••-'+f.phone.slice(-4),area:'Gulshan-e-Iqbal'};
  const r={id:'R-'+S.ids++,pid,source:'Screening camp, Gulshan Block 6',by:'Nasreen Akhtar',test:f.test,value:t.val,flag:t.flag,window:t.window,service:t.service,why:t.why,clinic:U.sel.clinic,status:'Awaiting review',created:dayName(),consent:`${dayName().split(' ').slice(1).join(' ')}, ${hm(S.min)}`,tags:tagsFor(S.patients[pid]),log:[]};
  log(r,`Screened by Nasreen Akhtar. Patient consented to share the result.`);log(r,`Referral sent to ${CLINICS[r.clinic].name}`);S.refs.push(r);msg(pid,'sms',`Turnly: Your ${f.test.toLowerCase()} result was ${t.val}. Nasreen has referred you to ${CLINICS[r.clinic].name}.`);
  U.sel.form=null;U.sel.step=1;U.tab='tracker';tick(2);toast(`Referral ${r.id} sent for doctor review`);render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();const k=U.sel.login||'patient',L=LOGINS[k];const id=$('#lid').value.trim(),pin=$('#lpin').value.trim();if(id.toLowerCase()!==L.id.toLowerCase()||pin!==L.pin){$('#lerr').textContent=`Use the test login: ${L.id} with PIN ${L.pin}.`;return}U.role=k;U.tab=null;U.sel={};render();window.scrollTo(0,0)}});
document.addEventListener('input',e=>{const t=e.target;const f=U.sel.form;if(!f)return;
 if(t.dataset.f&&t.type!=='checkbox'&&t.tagName!=='SELECT'){f[t.dataset.f]=t.value;if(t.dataset.f==='preg')updTri()}
 if(t.dataset.v){f.v[t.dataset.v]=t.value;updTri()}});
function updTri(){const f=U.sel.form;const b=$('#tri');if(b)b.innerHTML=triBox(triage(f.test,f.v,+f.preg||0),+f.preg||0)}
document.addEventListener('change',e=>{const t=e.target;const f=U.sel.form;
 if(t.dataset.consent){S.pconsent[t.dataset.consent]=t.checked;toast(t.checked?'Sharing turned on':'Sharing turned off');save();return}
 if(!f)return;if(t.dataset.f==='consent')f.consent=t.checked;if(t.dataset.f==='test'){f.test=t.value;f.v={};render()}if(t.dataset.chronic){f.chronic=t.checked?[...f.chronic,t.dataset.chronic]:f.chronic.filter(c=>c!==t.dataset.chronic)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
render();
</script>
